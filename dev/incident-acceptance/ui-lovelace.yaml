          - input_boolean.matter_a_unavailable
          - input_boolean.matter_a_battery_low
          - input_boolean.matter_b_smoke
          - input_boolean.matter_b_co
          - input_boolean.matter_b_interconnect
          - input_boolean.matter_b_test
          - input_boolean.matter_b_fault
          - input_boolean.matter_b_expired
          - input_boolean.matter_b_unavailable
          - input_boolean.matter_b_battery_low

      - type: entities
        title: SIMULATED Z-Wave JS - no controller or radio
        entities:
          - input_boolean.zwave_smoke
          - input_boolean.zwave_co
          - input_boolean.zwave_fault

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>AlarmMesh</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123A63"/>
      <stop offset="1" stop-color="#06162B"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D3E1EA"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FE0D0"/>
      <stop offset="1" stop-color="#19A9C4"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#FF6B3D" stop-opacity=".75"/>
      <stop offset="1" stop-color="#FF6B3D" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- tegel -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- mesh: buitenring (zacht) -->
  <polygon points="256,84 405,170 405,342 256,428 107,342 107,170"
           fill="none" stroke="#3FE0D0" stroke-opacity=".28" stroke-width="10" stroke-linejoin="round"/>

  <!-- mesh: spaken naar de centrale melder -->
  <g stroke="url(#line)" stroke-width="12" stroke-linecap="round">
    <line x1="256" y1="256" x2="256" y2="84"/>
    <line x1="256" y1="256" x2="405" y2="170"/>
    <line x1="256" y1="256" x2="405" y2="342"/>
    <line x1="256" y1="256" x2="256" y2="428"/>
    <line x1="256" y1="256" x2="107" y2="342"/>
    <line x1="256" y1="256" x2="107" y2="170"/>
  </g>

  <!-- knooppunten: elk een kleine melder -->
  <g fill="#3FE0D0">
    <circle cx="256" cy="84"  r="28"/>
    <circle cx="405" cy="170" r="28"/>
    <circle cx="405" cy="342" r="28"/>
    <circle cx="256" cy="428" r="28"/>
    <circle cx="107" cy="342" r="28"/>
    <circle cx="107" cy="170" r="28"/>
  </g>
  <g fill="#0B2442">
    <circle cx="256" cy="84"  r="11"/>
    <circle cx="405" cy="170" r="11"/>
    <circle cx="405" cy="342" r="11"/>
    <circle cx="256" cy="428" r="11"/>
    <circle cx="107" cy="342" r="11"/>
    <circle cx="107" cy="170" r="11"/>
  </g>

  <!-- centrale rookmelder (bovenaanzicht) -->
  <g filter="url(#shadow)">
    <circle cx="256" cy="256" r="104" fill="url(#face)"/>
  </g>
  <circle cx="256" cy="256" r="104" fill="none" stroke="#0B2442" stroke-opacity=".12" stroke-width="3"/>
  <!-- ventilatieringen -->
  <circle cx="256" cy="256" r="74" fill="none" stroke="#9FB6C6" stroke-width="7" stroke-dasharray="26 13" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="40" fill="#E9F1F6" stroke="#9FB6C6" stroke-width="6"/>
  <!-- status-LED -->
  <circle cx="256" cy="256" r="34" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="15" fill="#FF5A2E"/>
  <circle cx="251" cy="251" r="5" fill="#FFD2C2"/>
</svg>
